plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.asset_yug_debugging"
    // Change to 34 if you're having issues with AGP compatibility
    // compileSdk = 34
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.example.asset_yug_debugging"
        
        // Using 23 as minimum SDK since you specified that
        minSdkVersion flutter.minSdkVersion
        // targetSdk = flutter.targetSdkVersion
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.

            signingConfig = signingConfigs.debug
        }

// Ensure kernel_blob.bin can be overwritten during Flutter asset copy
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(":app:copyFlutterAssetsDebug")) {
        tasks.named("copyFlutterAssetsDebug") {
            doFirst {
                def dest = file("${buildDir}/intermediates/assets/debug/mergeDebugAssets/flutter_assets/kernel_blob.bin")
                if (dest.exists()) {
                    dest.delete()
                }
            }
        }
    }
}
    }
}

flutter {
    source = "../.."
}
